name: Deploy static JSON API to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - "apps/tech-shop-static-api/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static JSON resources
        run: node apps/tech-shop-static-api/generate-static-data.mjs

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "apps/tech-shop-static-api"
          api_location: ""
          output_location: ""
