name: Deploy apps to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate static API data
        run: node apps/tech-shop-static-api/generate-static-data.mjs

      - name: Build Angular apps
        run: |
          npx nx build food-shop --configuration production --base-href "${{ steps.pages.outputs.base_path }}/food-shop/"
          npx nx build food-shop-backoffice --configuration production --base-href "${{ steps.pages.outputs.base_path }}/food-shop-backoffice/"
          npx nx build tech-shop-welcome --configuration production --base-href "${{ steps.pages.outputs.base_path }}/tech-shop-welcome/"

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist/pages/food-shop
          mkdir -p dist/pages/food-shop-backoffice
          mkdir -p dist/pages/tech-shop-welcome
          mkdir -p dist/pages/tech-shop-static-api/api/order
          cp -R dist/apps/food-shop/. dist/pages/food-shop/
          cp -R dist/apps/food-shop-backoffice/. dist/pages/food-shop-backoffice/
          cp -R dist/apps/tech-shop-welcome/. dist/pages/tech-shop-welcome/
          cp apps/tech-shop-static-api/data/config.json dist/pages/tech-shop-static-api/api/config
          cp apps/tech-shop-static-api/data/product.json dist/pages/tech-shop-static-api/api/product
          cp apps/tech-shop-static-api/data/categories.json dist/pages/tech-shop-static-api/api/categories
          cp apps/tech-shop-static-api/data/order.json dist/pages/tech-shop-static-api/api/order
          for order in apps/tech-shop-static-api/data/orders/*.json; do
            cp "$order" "dist/pages/tech-shop-static-api/api/order/$(basename "$order" .json)"
          done

      - name: Upload apps artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
